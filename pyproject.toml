[project]
name = "diffusion-planner-workspace"
version = "0.1.0"
description = "Workspace for diffusion planner development tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "diffusion-planner",
    "diffusion-planner-dashboard",
    "wandb>=0.28.2",
    "zarr>=2.18.3,<3",
]

[dependency-groups]
dev = ["pre-commit>=4.6.1", "pyright>=1.1.411", "ruff>=0.16.1"]

[tool.uv]
package = false

[tool.uv.sources]
diffusion-planner = { workspace = true }
diffusion-planner-dashboard = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["ros2_ws"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["diffusion_planner", "diffusion_planner_dashboard"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
include = [
    "packages/diffusion_planner/src",
    "packages/diffusion_planner_dashboard/src",
]
exclude = [
    "ros2_ws",
    "outputs",
    "checkpoints",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".venv",
]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

reportMissingTypeStubs = false
reportUnusedImport = "warning"
reportUnusedVariable = "warning"

extraPaths = [
    "ros2_ws/install/ml_planner_data/local/lib/python3.10/dist-packages",
]
