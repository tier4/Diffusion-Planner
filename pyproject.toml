[project]
name = "diffusion-planner-workspace"
version = "4.0.0"
description = "Diffusion Planner workspace"
requires-python = ">=3.10,<3.11"
dependencies = [
    "diffusion-planner",
    "exploration-policy",
    "guidance-gui",
    "h5py",
    "hdf5plugin",
    "planner-metrics",
    "preference-optimization",
    "pyarrow",
    "rlvr",
    "scenario-generation",
    "scene-search",
    "tag-toolkit",
]

[dependency-groups]
dev = ["pre-commit==4.6.0", "pytest>=8.0.0", "ruff==0.15.16"]

[tool.uv]
# Timestamp form required by uv 0.7.x (relative "7 days" is unsupported).
exclude-newer = "2026-07-17T00:00:00Z"
constraint-dependencies = [
    "idna==3.15",
    "aiohttp==3.14.1",
    "starlette==1.0.1",
    # Driver 550 supports CUDA 12.4 only; PyPI/flatt torch defaults to CUDA 13.
    "torch==2.6.0",
    "torchvision==0.21.0",
]

[[tool.uv.index]]
name = "flatt"
url = "https://pypi.flatt.tech/simple/"
default = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.workspace]
members = [
    "diffusion_planner",
    "exploration_policy",
    "planner_metrics",
    "preference_optimization",
    "rlvr",
    "scenario_generation",
    "scene_search",
    "guidance_gui",
    "tag_toolkit",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
diffusion-planner = { workspace = true }
exploration-policy = { workspace = true }
planner-metrics = { workspace = true }
preference-optimization = { workspace = true }
rlvr = { workspace = true }
scenario-generation = { workspace = true }
scene-search = { workspace = true }
guidance-gui = { workspace = true }
tag-toolkit = { workspace = true }

[tool.pytest.ini_options]
markers = [
    "benchmark: performance profiling tests (deselect with '-m \"not benchmark\"')",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select=["I"]
extend-ignore=["ANN", "D", "FBT", "FIX", "PLR", "TD", "UP"]
ignore=[
    "B904",
    "C901",
    "COM812",
    "E501", "E721",
    "EM102",
    "F541",
    "FA102",
    "G004",
    "PERF203", "PERF401",
    "PLR2004",
    "PLW2901",
    "RET504",
    "RUF003", "RUF005",
    "S101", "S602",
    "SIM401",
    "SLF001",
    "T201",
    "TRY003",
]
