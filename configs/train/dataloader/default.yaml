# The dataset is nested here rather than being its own group: it exists only to feed this
# loader, and Hydra instantiates it recursively when the loader is built.
_target_: diffusion_planner.data.build_dataloader
dataset:
  # H5 frame index written by scripts/dataset/create_h5_dataset.py.
  _target_: diffusion_planner.data.PlannerDataset
  parquet_path: ???
  shuffle_buffer_size: 256
  seed: ${seed}
  data_augmentation:
    _target_: diffusion_planner.data.PlannerDataAugmentation
    lateral_offset_range: [-1.5, 1.5]
    yaw_offset_range: [-0.0872665, 0.0872665]
    ego_speed_scale_range: [0.5, 1.5]
    pose_probability: 0.5
    speed_probability: 0.5
  data_normalizer:
    _target_: diffusion_planner.data.PlannerDataNormalizer
    position_scale: 50.0
    speed_scale: 15.0
    vehicle_shape_scale: 10.0
# This batch size applies to each process/GPU (4096 globally with 8 GPUs).
batch_size: 512
shuffle: true
# Each process creates this many independent H5 streams.
num_workers: 16
# Keep more completed batches ready to absorb NFS latency spikes.
prefetch_factor: 4
# Do not let one slow H5 stream block ready batches from other workers.
in_order: false
pin_memory: true
drop_last: true
