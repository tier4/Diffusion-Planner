# The dataset is nested here rather than being its own group: it exists only to feed this
# loader, and Hydra instantiates it recursively when the loader is built.
defaults:
  - /train/dataloader/transforms@_global_.transform_configs.speed_augmentation: speed_augmentation
  - /train/dataloader/transforms@_global_.transform_configs.quintic_hermite_augmentation: quintic_hermite_augmentation
  - /train/dataloader/transforms@_global_.transform_configs.traffic_light: traffic_light
  - /train/dataloader/transforms@_global_.transform_configs.normalization: normalization
  - _self_

_target_: diffusion_planner.data.build_dataloader
dataset:
  # H5 frame index written by scripts/dataset/create_h5_dataset.py.
  _target_: diffusion_planner.data.PlannerDataset
  parquet_path: ???
  file_capacity: 8
  transforms:
    - ${transform_configs.speed_augmentation}
    - ${transform_configs.quintic_hermite_augmentation}
    - ${transform_configs.traffic_light}
    - ${transform_configs.normalization}
# This batch size applies to each process/GPU.
batch_size: 256
shuffle: true
# Eight training processes create 96 workers in total.
num_workers: 12
prefetch_factor: 4
pin_memory: true
drop_last: true
