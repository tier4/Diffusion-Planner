_target_: diffusion_planner.data.transforms.PlannerUnknownLabelAugmentation
# Base rename rate; per-class values below fall back to it when null.
# Start at 0.0 so the transform only widens the label to four columns.
probability: 0.0
probability_vehicle: null
probability_pedestrian: null
probability_bicycle: null
# Multiplier reached at distance_scale_range_m; 1.0 disables distance scaling.
distance_scale_max: 1.0
distance_scale_range_m: 50.0
# Upper bound after scaling; 1.0 disables capping.
probability_cap: 1.0
# Largest share of one frame's labelled agents that may become unknown.
max_renamed_fraction: 1.0
# Keep one agent of each class labelled in every frame. max_renamed_fraction bounds the
# frame as a whole, which does not stop a single class from vanishing: on 400 real frames at
# probability=0.1 / pedestrian=0.25 / bicycle=0.25 / distance_scale_max=2.0, 41 frames lost
# every pedestrian and 45 lost every bicycle. Off by default so existing runs are unchanged.
preserve_last_of_class: false
# Keep the class that was hidden, as `agent_label_true`, so a head can be asked to recover
# it (Phase 2.3) and so analysis can tell renamed agents from genuinely unknown ones.
# Off by default: it adds a tensor to every batch.
record_true_label: false
