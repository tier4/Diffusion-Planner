# @package _global_
# This config sits in configs/train, so without the package override above everything would
# be nested under `train`. The group name would also resolve under configs/train, so the
# leading slash makes it absolute against configs/ and @ binds it to a short key.
defaults:
  - /train/accelerator@accelerator: default
  - /train/dataloader@dataloader: default
  - /train/model@model: large_33m
  - /train/optimizer@optimizer: default
  - /train/scheduler@scheduler: default
  - _self_

seed: 42
experiment_name: ???

training:
  total_epochs: 50
  max_grad_norm: 1.0
  time_mean: -0.4
  time_std: 1.0
  time_epsilon: 1.0e-5
  noise_scale: 1.0
  ego_loss_weight: 100.0
  neighbor_loss_weight: 1.0
  turn_indicator_loss_weight: 1e-3
  turn_indicator_transition_loss_weight: 1.0
  log_interval: 200
  checkpoint_interval: 2000
  checkpoint_dir: checkpoints
  resume_from: null
  warm_start: false
