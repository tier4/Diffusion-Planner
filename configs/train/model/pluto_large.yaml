_target_: diffusion_planner.models.pluto_planner.PlutoPlanner

# Scene encoder: same values as large_33m.yaml so encoder weights are comparable.
hidden_dim: 384
num_heads: 12
scene_fusion_depth: 6
element_encoder_depth: 1
element_mixer_hidden_dim: 32
encoder_dropout: 0.0
drop_path_rate: 0.0

# PLUTO decoder (PLUTO: depth 4, mlp_ratio 4, dropout 0.1, num_modes 12).
decoder_depth: 4
feedforward_dim: 1536
dropout: 0.1
num_modes: 12
cat_ego_token: false

# Turn-indicator decoder (unchanged from the flow-matching model).
trajectory_encoder_depth: 1
trajectory_mixer_hidden_dim: 32

velocity_threshold: 0.1
goal_max_distance: 2.0
