_target_: diffusion_planner.models.diffusion_planner.DiffusionPlanner

hidden_dim: 512
num_heads: 16

scene_fusion_depth: 8
element_encoder_depth: 1
element_mixer_hidden_dim: 32

decoder_depth: 8
trajectory_encoder_depth: 1
trajectory_mixer_hidden_dim: 32

feedforward_dim: 2048

drop_path_rate: 0.0
dropout: 0.0

velocity_threshold: 0.1
goal_max_distance: 2.0

# "one_hot" gives unknown its own orthogonal column, as if it were a fourth kind of object.
# "class_prior" encodes it as a learned prior over the known classes plus one uncertainty
# vector, which is what an unknown agent actually is and how the augmentation builds it.
# Costs 3 parameters. Default keeps existing runs unchanged.
agent_label_encoder: one_hot
