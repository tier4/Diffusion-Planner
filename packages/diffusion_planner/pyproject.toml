[project]
name = "diffusion-planner"
version = "0.1.0"
description = "Model and visualization library for diffusion planner"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.14.0",
    "argcomplete>=3.7.0",
    "einops>=0.8.0",
    "h5py>=3.16.0",
    "hdf5plugin>=7.0.0",
    "hydra-core>=1.3",
    "numba>=0.67.0",
    "numpy>=2.2.6",
    "onnx>=1.22.0",
    "onnxruntime<1.24",
    "onnxruntime-gpu<1.24",
    "onnxscript>=0.7.1",
    "plotly>=6.9.0",
    "pyarrow>=25.0.0",
    "timm>=1.0.28",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
