[project]
name = "diffusion_planner"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "einops",
    "gradio",
    "h5py>=3.16.0",
    "hdf5plugin>=7.0.0",
    "matplotlib",
    "natsort",
    "numpy>=1.26,<2",
    "onnx",
    "onnxruntime-gpu",
    "onnxsim",
    "opencv-python",
    "pandas>=2,<3",
    "peft",
    "planner-metrics",
    "protobuf",
    "pyarrow>=24.0.0",
    "pydantic",
    "pytorch-lightning",
    "scipy",
    "timm",
    "torch==2.11.0",
    # Not imported here, but timm pulls it and its compiled operators must have been built
    # against the same torch. Declared so it can be pinned to the same index; a mismatch shows
    # up as `operator torchvision::nms does not exist` when timm is imported.
    "torchvision==0.26.0",
    "tqdm",
    "wandb",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
planner-metrics = { workspace = true }
