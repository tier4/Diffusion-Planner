[project]
name = "diffusion_planner"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "einops",
    "gradio",
    "matplotlib",
    "natsort",
    "numpy>=1.26,<2",
    "onnx",
    "onnxruntime-gpu",
    "onnxsim",
    "opencv-python",
    "pandas>=2,<3",
    "peft",
    "planner-metrics",
    "protobuf",
    "pydantic",
    "pytorch-lightning",
    "scipy",
    "timm",
    "torch",
    "tqdm",
    "wandb",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
planner-metrics = { workspace = true }
